<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    #player { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      sendToFlutter({
        type: 'jsError',
        message: message,
        lineno: lineno
      });
    };

    var player;
    var isPlayerReady = false;

    // بنخزن هنا طلب المزامنة المعلّق، وهيتطبق بس لما الفيديو يوصل
    // لحالة CUED (5) - دي أول لحظة مضمونة إن الفيديو جاهز 100% ومحمّل
    // بالكامل ويقدر يستجيب لأمر seekTo بدقة كاملة
    var pendingStartSeconds = null;
    var pendingShouldPlay = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'fs': 0,
          'disablekb': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }
    function onPlayerReady(event) {
      isPlayerReady = true;
      sendToFlutter({type: 'ready'});
    }
    function onPlayerStateChange(event) {
      sendToFlutter({type: 'stateChange', state: event.data});

      // event.data === 5 يعني CUED: الفيديو اتحمّل بالكامل وجاهز
      // يستقبل أمر seekTo دقيق، ودي اللحظة الوحيدة المضمونة للمزامنة
      if (pendingStartSeconds !== null && event.data === 5) {
        var startAt = pendingStartSeconds;
        var shouldPlay = pendingShouldPlay;

        pendingStartSeconds = null;
        pendingShouldPlay = null;

        player.seekTo(startAt, true);

        if (shouldPlay) {
          player.playVideo();
        }
      }
    }
    function onPlayerError(event) {
      sendToFlutter({type: 'error', code: event.data});
    }
    function sendToFlutter(data) {
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify(data));
      }
    }
    function flutterPlay() { if (isPlayerReady) player.playVideo(); }
    function flutterPause() { if (isPlayerReady) player.pauseVideo(); }
    function flutterSeekTo(seconds) { if (isPlayerReady) player.seekTo(seconds, true); }
    function flutterLoadVideo(videoId) {
      if (isPlayerReady) player.cueVideoById(videoId);
    }
    function flutterLoadAndSync(videoId, startAt, shouldPlay) {
      if (!isPlayerReady) return;

      // بنسجل المزامنة كـ"معلّقة"، وهتتطبق فعليًا في onPlayerStateChange
      // لما الفيديو يوصل لحالة CUED (مش وقت النداء نفسه)
      pendingStartSeconds = startAt;
      pendingShouldPlay = shouldPlay;

      // cueVideoById بتحمّل الفيديو من غير تشغيل تلقائي فوري، وده اللي
      // بيضمن حدوث حالة CUED اللي بنستنى عليها فوق. لو استخدمنا
      // loadVideoById بدل كده، الفيديو بيشتغل فورًا ويتخطى حالة CUED
      // خالص، فمينفعش نستخدمها هنا
      player.cueVideoById({
        videoId: videoId,
        startSeconds: startAt
      });
    }
    function flutterGetState() {
      if (!isPlayerReady) return;
      sendToFlutter({
        type: 'currentState',
        state: player.getPlayerState(),
        position: player.getCurrentTime()
      });
    }
  </script>
</body>
</html>
