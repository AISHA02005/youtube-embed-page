<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    #player { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      sendToFlutter({
        type: 'jsError',
        message: message,
        lineno: lineno
      });
    };

    var player;
    var isPlayerReady = false;

    // بنخزن هنا أي طلب مزامنة لسه مطبقناهوش، لحد ما الفيديو يبقى جاهز
    // فعليًا يستقبل أمر seekTo (مش مجرد لحظة استدعاء loadVideoById)
    var pendingStartSeconds = null;
    var pendingShouldPlay = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'fs': 0,
          'disablekb': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }
    function onPlayerReady(event) {
      isPlayerReady = true;
      sendToFlutter({type: 'ready'});
    }
    function onPlayerStateChange(event) {
      sendToFlutter({type: 'stateChange', state: event.data});

      // event.data: 1 = playing, 3 = buffering
      // دي أول لحظة نضمن فيها إن الفيديو استقبل الـMetadata بتاعه فعليًا
      // وبقى جاهز يستجيب لأمر seekTo بدقة، فبنطبق المزامنة المعلّقة هنا
      if (pendingStartSeconds !== null &&
          (event.data === 1 || event.data === 3)) {
        player.seekTo(pendingStartSeconds, true);

        if (!pendingShouldPlay) {
          setTimeout(function() {
            player.pauseVideo();
          }, 300);
        }

        pendingStartSeconds = null;
        pendingShouldPlay = null;
      }
    }
    function onPlayerError(event) {
      sendToFlutter({type: 'error', code: event.data});
    }
    function sendToFlutter(data) {
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify(data));
      }
    }
    function flutterPlay() { if (isPlayerReady) player.playVideo(); }
    function flutterPause() { if (isPlayerReady) player.pauseVideo(); }
    function flutterSeekTo(seconds) { if (isPlayerReady) player.seekTo(seconds, true); }
    function flutterLoadVideo(videoId) {
      if (isPlayerReady) player.cueVideoById(videoId);
    }
    function flutterLoadAndSync(videoId, startAt, shouldPlay) {
      if (!isPlayerReady) return;

      // بنسجل المزامنة المطلوبة كـ"معلّقة"، وهتتطبق فعليًا في
      // onPlayerStateChange لما الفيديو يبقى جاهز فعلًا للـseek
      pendingStartSeconds = startAt;
      pendingShouldPlay = shouldPlay;

      player.loadVideoById({
        videoId: videoId,
        startSeconds: startAt
      });
    }
    function flutterGetState() {
      if (!isPlayerReady) return;
      sendToFlutter({
        type: 'currentState',
        state: player.getPlayerState(),
        position: player.getCurrentTime()
      });
    }
  </script>
</body>
</html>
