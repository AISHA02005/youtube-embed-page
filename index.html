<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    #player { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      sendToFlutter({ type: 'jsError', message: message, lineno: lineno });
    };

    var player;
    var isPlayerReady = false;
    var pendingStartSeconds = null;
    var pendingShouldPlay = null;
    var targetVideoId = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'fs': 0,
          'disablekb': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      isPlayerReady = true;
      sendToFlutter({type: 'ready'});
    }

    function onPlayerStateChange(event) {
      sendToFlutter({type: 'stateChange', state: event.data});

      // بنتأكد إن الفيديو اللي بيتشغل دلوقتي هو نفسه الفيديو المطلوب
      // (مش إعلان)، عن طريق مقارنة الـvideoId الفعلي من الـplayer
      var currentVideoData = player.getVideoData();
      var isCorrectVideo = currentVideoData && currentVideoData.video_id === targetVideoId;

      if (pendingStartSeconds !== null && event.data === 5 && isCorrectVideo) {
        applyPendingSync();
      }

      // الحالة PLAYING (1) بعد ما الفيديو الصحيح يبدأ فعليًا - دي أول
      // لحظة موثوقة نقدر نطبق فيها seekTo لو لسه فيه مزامنة معلّقة
      // (بيحصل لو الإعلان أخّر وصولنا لحالة CUED)
      if (pendingStartSeconds !== null && event.data === 1 && isCorrectVideo) {
        applyPendingSync();
      }
    }

function applyPendingSync() {
  var startAt = pendingStartSeconds;
  var shouldPlay = pendingShouldPlay;
  pendingStartSeconds = null;
  pendingShouldPlay = null;

  player.seekTo(startAt, true);
  if (shouldPlay) {
    player.playVideo();
  } else {
    player.pauseVideo();
  }

  setTimeout(function() {
    player.unMute();
  }, 300);
}

    function onPlayerError(event) {
      sendToFlutter({type: 'error', code: event.data});
    }

    function sendToFlutter(data) {
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify(data));
      }
    }

    function flutterPlay() { if (isPlayerReady) player.playVideo(); }
    function flutterPause() { if (isPlayerReady) player.pauseVideo(); }
    function flutterSeekTo(seconds) { if (isPlayerReady) player.seekTo(seconds, true); }

function flutterLoadVideo(videoId) {
  if (isPlayerReady) {
    player.mute();
    player.cueVideoById(videoId);
  }
}

function flutterLoadAndSync(videoId, startAt, shouldPlay) {
  if (!isPlayerReady) return;
  targetVideoId = videoId;
  pendingStartSeconds = startAt;
  pendingShouldPlay = shouldPlay;
  player.mute();
  player.loadVideoById({ videoId: videoId, startSeconds: startAt });
}

    function flutterGetState() {
      if (!isPlayerReady) return;

      var currentVideoData = player.getVideoData();
      var isCorrectVideo = currentVideoData && currentVideoData.video_id === targetVideoId;

      // لو إعلان شغال دلوقتي مش الفيديو الأصلي، منبعتش الموضع الحالي
      // خالص، عشان منلخبطش الحسابات عند الطرف التاني بوقت الإعلان
      if (!isCorrectVideo) return;

      sendToFlutter({
        type: 'currentState',
        state: player.getPlayerState(),
        position: player.getCurrentTime()
      });
    }
  </script>
</body>
</html>
